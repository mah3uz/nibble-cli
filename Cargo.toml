[package]
name = "nibble-cli"
version = "0.1.0"
edition = "2024"
description = "Start a Nibble site, run its tasks, and work on your sites' content"
license = "MIT"
repository = "https://github.com/mah3uz/nibble-cli"

[[bin]]
name = "nibble"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "8"
dirs = "7"
flate2 = "1"
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1"
url = "2"
webbrowser = "1"
